<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    

    <div class="container">
        <div class="row mb-3 mt-3">
            <div class="col-4 m-auto">
                <h1>Registration Form</h1>
            </div>
        </div>


        <div class="row mb-3">
            <div class="col-6">
        <input class="form-control" type="text" placeholder="First Name" aria-label="default input example">

            </div>


             <div class="col-6">
                <input class="form-control" type="text" placeholder="Last Name" aria-label="default input example">

            </div>
        </div>


         <div class="row mb-3">
            <div class="col-6">
                    <input class="form-control" type="email" placeholder="Email" aria-label="default input example">

            </div>


             <div class="col-6">
            <input class="form-control" type="password" placeholder="password" aria-label="default input example">

            </div>
        </div>


         <div class="row mb-3">
            <div class="col-6">
                
                <select class="form-select" aria-label="Default select example">
  <option selected>Select Your City</option>
  <option value="1">hyderabad</option>
  <option value="2">karachi</option>
  <option value="3">lahore</option>
</select>

            </div>


             <div class="col-6">
                <div class="form-check">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
  <label class="form-check-label" for="flexRadioDefault1">
    Male
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
  <label class="form-check-label" for="flexRadioDefault2">
    Female
  </label>
</div>
            </div>
        </div>


        <div class="row ">
            <div class="col-1 ms-auto">
                <a href="" class="btn btn-primary">Submit</a>
            </div>
        </div>
    </div>

</body>
</html>
